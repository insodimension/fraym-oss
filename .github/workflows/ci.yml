name: CI

# Typecheck + tests on every push to main and every pull request (including
# forks). Read-only — no secrets, no publish. This is the gate a contributor's
# PR must pass before a maintainer merges it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Typecheck (tsc -b)
        run: bun run typecheck
      - name: Test
        run: bun test
