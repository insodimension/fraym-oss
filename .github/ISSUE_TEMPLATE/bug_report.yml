name: Bug report
description: Something in a @fraym-ai/* package behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first, and do **not**
        file security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@fraym-ai/ui"
        - "@fraym-ai/driver"
        - "@fraym-ai/host"
        - "@fraym-ai/driver-acp"
        - "@fraym-ai/driver-codex"
        - "@fraym-ai/driver-aisdk"
        - "@fraym-ai/driver-test"
        - "@fraym-ai/fixtures"
        - "@fraym-ai/config"
        - "@fraym-ai/verber"
        - "@fraym-ai/vibr"
        - "@fraym-ai/cli"
        - "@fraym-ai/template-web-agent"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal repro — ideally a snippet or a link to a small repo.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bun/Node version, OS, browser, React version.
      placeholder: "Bun 1.3.14, Node 20, macOS 14, Chrome 126, React 19.2"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
    validations:
      required: false
